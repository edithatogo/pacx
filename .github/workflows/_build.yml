name: PACX Build

on:
  workflow_call:
    inputs:
      os:
        description: Runner OS to use
        required: false
        type: string
        default: ubuntu-latest
      solution_path:
        description: Path to the solution file
        required: false
        type: string
        default: Greg.Xrm.Command/Greg.Xrm.Command.sln
      dotnet_version:
        description: .NET SDK version to use
        required: false
        type: string
        default: 11.0.100-preview.3.26207.106
      target_framework:
        description: Target framework built by the selected SDK
        required: false
        type: string
        default: net11.0
      collect_coverage:
        description: Collect and upload Cobertura coverage from this matrix leg
        required: false
        type: boolean
        default: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Clear stale SDK overrides
        shell: pwsh
        run: Remove-Item Env:MSBuildSDKsPath -ErrorAction SilentlyContinue

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
          cache: false
          cache-dependency-path: |
            Greg.Xrm.Command/Directory.Build.props
            Greg.Xrm.Command/**/*.csproj
            **/packages.lock.json
            global.json

      - name: Install coverage tool
        if: ${{ inputs.collect_coverage }}
        shell: pwsh
        run: dotnet tool install --tool-path (Join-Path $env:RUNNER_TEMP "dotnet-tools") dotnet-coverage --version 18.9.0

      - name: Restore dependencies
        run: dotnet restore ${{ inputs.solution_path }} -p:TargetFramework=${{ inputs.target_framework }}

      - name: Build
        shell: pwsh
        run: |
          $buildArgs = @(
            "${{ inputs.solution_path }}",
            "--configuration", "Release",
            "--framework", "${{ inputs.target_framework }}",
            "--no-restore"
          )
          if (${{ inputs.collect_coverage }}) {
            $buildArgs += "-p:DebugType=portable"
          }
          dotnet build @buildArgs

      - name: Test
        shell: pwsh
        timeout-minutes: 20
        run: |
          $testProjects = @(
            "Greg.Xrm.Command/Greg.Xrm.Command.Core.TestSuite/Greg.Xrm.Command.Core.TestSuite.csproj",
            "Greg.Xrm.Command/Greg.Xrm.Command.ArchitectureTests/Greg.Xrm.Command.ArchitectureTests.csproj"
          )

          # The MCP host and its test SDK target net10.0; the net11.0 matrix leg
          # still validates the shared core and architecture assemblies.
          if ("${{ inputs.target_framework }}" -eq "net10.0") {
            $testProjects += "Greg.Xrm.Command/Greg.Xrm.Command.Mcp.Tests/Greg.Xrm.Command.Mcp.Tests.csproj"
          }

          foreach ($testProject in $testProjects) {
            Write-Host "Testing $testProject"
            $projectName = [System.IO.Path]::GetFileNameWithoutExtension($testProject)
            $resultsRoot = Join-Path $env:RUNNER_TEMP "test-results/$projectName"

            if ($projectName -eq "Greg.Xrm.Command.Core.TestSuite") {
              New-Item -ItemType Directory -Path $resultsRoot -Force | Out-Null
              $testAssembly = "Greg.Xrm.Command/Greg.Xrm.Command.Core.TestSuite/bin/Release/${{ inputs.target_framework }}/Greg.Xrm.Command.Core.TestSuite.dll"
              $mtpArgs = @(
                "--results-directory", $resultsRoot,
                "--hangdump",
                "--hangdump-timeout", "3m",
                "--hangdump-type", "Mini"
              )

              if (${{ inputs.collect_coverage }}) {
                $coverageTool = Join-Path $env:RUNNER_TEMP "dotnet-tools/dotnet-coverage"
                $coverageData = Join-Path $resultsRoot "coverage.coverage"
                $coverageOutput = Join-Path $resultsRoot "coverage.cobertura.xml"
                $coverageLog = Join-Path $resultsRoot "dotnet-coverage.log"
                $coverageSession = [guid]::NewGuid().ToString()
                $coreAssembly = (Resolve-Path -LiteralPath "Greg.Xrm.Command/Greg.Xrm.Command.Core/bin/Release/${{ inputs.target_framework }}/Greg.Xrm.Command.Core.dll").Path
                $interfacesAssembly = (Resolve-Path -LiteralPath "Greg.Xrm.Command/Greg.Xrm.Command.Interfaces/bin/Release/${{ inputs.target_framework }}/Greg.Xrm.Command.Interfaces.dll").Path
                foreach ($coverageAssembly in @($coreAssembly, $interfacesAssembly)) {
                  & $coverageTool instrument --session-id $coverageSession $coverageAssembly
                  if ($LASTEXITCODE -ne 0) {
                    throw "Failed to instrument $coverageAssembly for coverage."
                  }
                }

                & $coverageTool collect --session-id $coverageSession --server-mode --background --output $coverageData --log-file $coverageLog --log-level Verbose
                if ($LASTEXITCODE -ne 0) {
                  throw "Failed to start coverage session $coverageSession."
                }

                $testExitCode = 0
                try {
                  dotnet exec $testAssembly @mtpArgs
                  $testExitCode = $LASTEXITCODE
                } finally {
                  & $coverageTool shutdown $coverageSession
                  if ($LASTEXITCODE -ne 0) {
                    throw "Failed to stop coverage session $coverageSession."
                  }
                }

                if ($testExitCode -ne 0) {
                  exit $testExitCode
                }
                if (-not (Test-Path -LiteralPath $coverageData)) {
                  if (Test-Path -LiteralPath $coverageLog) {
                    Get-Content -LiteralPath $coverageLog
                  }
                  throw "Coverage session completed without producing $coverageData."
                }
                & $coverageTool merge $coverageData --output $coverageOutput --output-format cobertura
                if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $coverageOutput)) {
                  throw "Failed to convert native coverage data to Cobertura."
                }
              } else {
                dotnet exec $testAssembly @mtpArgs
              }
              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
              continue
            }

            $testArgs = @(
              $testProject,
              "--configuration", "Release",
              "--framework", "${{ inputs.target_framework }}",
              "--verbosity", "normal",
              "--results-directory", $resultsRoot
            )
            $testArgs += "--blame-hang"
            $testArgs += "--blame-hang-timeout"
            $testArgs += "3m"
            $testArgs += "--blame-hang-dump-type"
            $testArgs += "mini"

            if ($projectName -ne "Greg.Xrm.Command.Mcp.Tests") {
              $testArgs += "--no-build"
            } else {
              $testArgs += "-p:TargetFrameworks=net10.0"
            }

            dotnet test @testArgs
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Stage coverage artifact
        if: ${{ inputs.collect_coverage }}
        shell: pwsh
        run: |
          # Microsoft Testing Platform extensions may write under the project
          # TestResults directory even when dotnet test receives --results-directory.
          $coverageRoots = @(
            (Join-Path $env:RUNNER_TEMP "test-results"),
            $env:GITHUB_WORKSPACE
          )
          $coverageFile = Get-ChildItem -Path $coverageRoots -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'coverage|cobertura' } |
            Sort-Object LastWriteTimeUtc -Descending |
            Where-Object {
              try {
                [xml]$document = Get-Content -LiteralPath $_.FullName -Raw
                $document.DocumentElement.Name -eq "coverage"
              } catch {
                $false
              }
            } |
            Select-Object -First 1
          if (-not $coverageFile) {
            throw "No Cobertura coverage file was produced by the core test suite."
          }

          $artifactRoot = Join-Path $env:RUNNER_TEMP "coverage-artifact"
          if (Test-Path -LiteralPath $artifactRoot) {
            Remove-Item -LiteralPath $artifactRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $artifactRoot | Out-Null
          Copy-Item -LiteralPath $coverageFile.FullName -Destination (Join-Path $artifactRoot "coverage.cobertura.xml") -Force

      - name: Upload coverage artifact
        if: ${{ inputs.collect_coverage }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-cobertura
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/coverage-artifact/coverage.cobertura.xml

      - name: Lint
        run: dotnet format ${{ inputs.solution_path }} --verify-no-changes
